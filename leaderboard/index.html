<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SambarreyDart — Classement</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <p class="kicker">SAMBARREY DART</p>
        <h1>Classement</h1>
      </div>
      <p id="updatedAt" class="updated hidden"></p>
    </header>

    <section id="loading" class="state">
      <div class="loader-board" aria-hidden="true">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-bull"></div>
      </div>
      <p>Chargement du classement…</p>
    </section>

    <section id="empty" class="state hidden">
      <p>Pas encore de partie terminée.</p>
    </section>

    <section id="board" class="hidden">
      <div class="tabs" role="tablist">
        <button id="tabPodium" class="tab active" role="tab" aria-selected="true">Podium</button>
        <button id="tabByMode" class="tab" role="tab" aria-selected="false">Détail par mode</button>
      </div>

      <div id="podiumView">
        <div id="podium" class="podium"></div>
        <p id="jokeLine" class="joke hidden">Si je ne suis pas premier, c'est qu'un hacker a eu accès à la BDD et a modifié les stats.</p>
        <div id="rest" class="rest"></div>
      </div>

      <div id="modeView" class="hidden">
        <div id="modeList" class="mode-list"></div>
      </div>
    </section>
  </main>

  <!-- Accueil joué une fois par visite, à la première réception du classement. -->
  <div id="welcome" class="overlay hidden">
    <dotlottie-wc id="welcomeConfetti" class="welcome-confetti" src="assets/lottie/confetti.lottie" loop autoplay></dotlottie-wc>
    <div class="welcome-card">
      <p class="kicker">SAMBARREY DART</p>
      <h2>Bienvenue sur le classement !</h2>
      <p>Suivez qui domine la maison, en direct.</p>
      <button id="welcomeClose" class="welcome-close">C'est parti</button>
    </div>
  </div>

  <!--
    SDK Firebase (modulaire, v12) chargé directement depuis gstatic — page
    statique, aucune dépendance à builder : la config (firebase-config.js)
    est le seul fichier à remplacer une fois le vrai projet Firebase créé.
    dotlottie-wc (version figée) joue confetti.lottie à l'accueil, le même
    fichier que la vraie app utilise pour sa victoire.
  -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.9.25/dist/dotlottie-wc.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
